{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增資料</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <img id="logo" src="{% static 'icon/logo.jpg' %}" alt="">
        </div>
    </nav>

    <div class="full-height-div">
        <br>
        <ul class="navbar-nav">
            <li>
                <a class="nav-link {% if request.resolver_match.url_name == 'main' %}active-link{% endif %}" aria-current="page" href="{% url 'main' user.id %}">
                    <img id="icon" src="{% static 'icon/group-users.png' %}" style="vertical-align: middle;">
                    <span style="vertical-align: middle;">會員資料</span>
                </a>
                
            </li>
            <br>
            <li>
                <a class="nav-link {% if request.path == '/opendoor/' %}active-link{% endif %}" aria-current="page" href="{% url 'opendoor' user.id %}">
                    <img id="icon" src="{% static 'icon/door.png' %}" style="vertical-align: middle;">
                    <span style="vertical-align: middle;">開門介面</span>
                </a>
            </li>
            <br>
            <li>

                <a class="nav-link {% if request.resolver_match.url_name == 'log' %}active-link{% endif %}" aria-current="page" href="{% url 'log' user.id %}">
                    <img id="icon" src="{% static 'icon/data.png' %}" style="vertical-align: middle;">
                    <span style="vertical-align: middle;">事件紀錄</span>
                </a>
                
            </li>
            <br>
            <li>
                <a class="nav-link {% if request.path == '/loginout/' %}active-link{% endif %}" aria-current="page" href="{% url 'loginout' %}">
                    <img id="icon" src="{% static 'icon/logout.png' %}" style="vertical-align: middle;">
                    <span style="vertical-align: middle;">登出</span>
                </a>
            </li>
        </ul>
    </div>

    <footer class="fixed-bottom custom-bg-color text-dark text-center p-3">
        國立臺中科技大學 National Taichung University of Science and Technology
    </footer>
</body>

</html>
